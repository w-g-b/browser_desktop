# Whitelist Configuration
#
# Format: One URL pattern per line.
# Wildcard (*) is supported for domain and path matching.
# Lines starting with '#' are comments and will be ignored.
# Blank lines are ignored.
#
# Examples:
#   google.com           - Allow google.com (exact domain)
#   *.google.com         - Allow all subdomains of google.com
#   github.com           - Allow github.com
#   https://example.com  - Allow specific URL with protocol
#   *.example.com/path/* - Allow subdomain with path wildcard

# Default allowed entries
https://www.google.com
https://*.google.com
